# Contrôle bloquant : chaque push et chaque pull request relancent les contrôles des Actualités.
name: controle-articles
on:
  push:
    paths: ["content/**", "scripts/**", "actualites/**", "*.html", "assets/**", "sitemap.xml", "rss.xml"]
  pull_request:
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contrôles éditoriaux et fichiers générés à jour
        run: node scripts/build.mjs --check
